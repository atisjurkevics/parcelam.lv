<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PĀRCEĻAM — Pārvākšanās un transporta pakalpojumi</title>
<meta name="description" content="PĀRCEĻAM — pārvākšanās un transporta pakalpojumi. Dzīvokļi, mājas, biroji.">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#111;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
main{width:min(1050px,90vw);padding:50px 0}
.brand{font-size:clamp(56px,11vw,130px);font-weight:950;letter-spacing:-.075em;line-height:.82}
.brand b{color:#ffd400}.line{height:7px;width:105px;background:#ffd400;margin:28px 0}
h1{font-size:clamp(23px,4vw,46px);margin:0 0 16px;font-weight:800}
.services{font-size:clamp(14px,2vw,21px);font-weight:700;letter-spacing:.08em}
.phone{margin-top:40px;font-size:clamp(20px,3vw,32px);font-weight:800}
.phone a{color:#ffd400;text-decoration:none}.soon{margin-top:50px;color:#aaa;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.corner{position:fixed;right:-110px;bottom:-130px;width:380px;height:380px;background:#ffd400;transform:rotate(45deg)}
</style>
</head>
<body>
<main>
<div class="brand">PĀRCEĻ<b>AM</b></div>
<div class="line"></div>
<h1>Pārvākšanās un transporta pakalpojumi</h1>
<div class="services">DZĪVOKĻI • MĀJAS • BIROJI</div>
<div class="soon">Mājaslapa tiek izstrādāta</div>
</main>
<div class="corner"></div>
</body>
</html>
