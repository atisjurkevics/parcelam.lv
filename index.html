<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PĀRCEĻAM — Drīzumā</title>
<meta name="description" content="PĀRCEĻAM — mājaslapa top. Darbu sāksim 2027. gadā.">
<style>
:root{
  --yellow:#ffd400;
  --yellow2:#ffb800;
  --black:#030303;
  --white:#f7f7f7;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black)}
body{
  font-family:Arial,Helvetica,sans-serif;
  color:var(--white);
  overflow-x:hidden;
}
.page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:28px 18px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 34%,rgba(255,212,0,.13),transparent 32%),
    linear-gradient(180deg,#020202 0%,#080808 52%,#020202 100%);
}
.page:before{
  content:"";
  position:absolute;
  left:-8%;
  right:-8%;
  top:20%;
  height:2px;
  background:var(--yellow);
  box-shadow:0 0 22px var(--yellow),0 0 55px rgba(255,212,0,.65);
  transform:rotate(-5deg);
  opacity:.7;
}
.page:after{
  content:"";
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:23%;
  height:2px;
  background:var(--yellow);
  box-shadow:0 0 20px var(--yellow);
  transform:rotate(5deg);
  opacity:.45;
}
.wrap{
  width:min(1040px,100%);
  text-align:center;
  position:relative;
  z-index:2;
}
.logo{
  display:inline-flex;
  align-items:baseline;
  font-weight:950;
  font-style:italic;
  font-size:clamp(48px,10vw,108px);
  line-height:.82;
  letter-spacing:-6px;
  text-transform:uppercase;
  filter:drop-shadow(0 0 18px rgba(255,212,0,.18));
  margin-bottom:32px;
}
.logo .move{
  color:var(--yellow);
}
.logo .am{
  color:#fff;
}
.logo-line{
  width:min(500px,62vw);
  height:5px;
  margin:0 auto 34px;
  background:linear-gradient(90deg,transparent,var(--yellow),transparent);
  box-shadow:0 0 18px rgba(255,212,0,.8);
}
.hero{
  position:relative;
  margin:0 auto 34px;
  width:min(920px,100%);
  height:clamp(180px,27vw,285px);
  display:flex;
  align-items:flex-end;
  justify-content:center;
  overflow:hidden;
  border-radius:18px;
}
.hero:before{
  content:"";
  position:absolute;
  width:82%;
  height:65%;
  bottom:0;
  border-radius:50% 50% 10% 10%;
  background:
    linear-gradient(115deg,transparent 8%,rgba(255,212,0,.45) 15%,transparent 24%),
    linear-gradient(70deg,#080808,#151515 50%,#050505);
  border-bottom:4px solid var(--yellow);
  box-shadow:
    0 28px 55px rgba(0,0,0,.9),
    0 0 34px rgba(255,212,0,.22);
  transform:perspective(500px) rotateX(8deg);
}
.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,transparent 0 8%,rgba(255,212,0,.7) 11%,transparent 15% 80%,rgba(255,212,0,.5) 84%,transparent 90%),
    radial-gradient(ellipse at center bottom,rgba(255,212,0,.25),transparent 58%);
  mix-blend-mode:screen;
  opacity:.65;
}
.message{
  position:relative;
  z-index:3;
  margin-top:-18px;
}
h1{
  margin:0;
  font-size:clamp(40px,7.2vw,76px);
  line-height:.95;
  font-weight:900;
  font-style:italic;
  letter-spacing:-3px;
}
h1 .white{color:#fff}
h1 .yellow{color:var(--yellow)}
.sub{
  margin:18px auto 24px;
  font-size:clamp(16px,2.4vw,23px);
  color:#e9e9e9;
  line-height:1.45;
}
.launch{
  width:min(760px,92vw);
  margin:0 auto;
  padding:15px 24px;
  border:2px solid var(--yellow);
  border-radius:16px;
  background:rgba(0,0,0,.55);
  box-shadow:0 0 28px rgba(255,212,0,.22),inset 0 0 20px rgba(255,212,0,.05);
  font-size:clamp(17px,2.7vw,27px);
  font-weight:800;
}
.launch .cal{color:var(--yellow);margin-right:10px}
.launch strong{color:var(--yellow)}
.footer{
  margin-top:26px;
  font-size:clamp(16px,2.2vw,22px);
  font-weight:700;
  font-style:italic;
  letter-spacing:.5px;
}
.footer:before,.footer:after{
  content:"";
  display:inline-block;
  width:80px;
  height:2px;
  background:var(--yellow);
  box-shadow:0 0 10px var(--yellow);
  vertical-align:middle;
  margin:0 18px;
}
@media(max-width:600px){
  .page{padding:20px 14px}
  .logo{letter-spacing:-3px;margin-bottom:24px}
  .logo-line{height:3px;margin-bottom:24px}
  .hero{height:170px;margin-bottom:26px}
  .launch{padding:13px 14px}
  .footer:before,.footer:after{width:38px;margin:0 8px}
}
</style>
</head>
<body>
<main class="page">
  <div class="wrap">
    <div class="logo" aria-label="PĀRCEĻAM">
      <span class="move">PĀRCEĻ</span><span class="am">AM</span>
    </div>

    <div class="logo-line"></div>

    <div class="hero" aria-hidden="true"></div>

    <section class="message">
      <h1><span class="white">Mēs vēl </span><span class="yellow">topam!</span></h1>
      <p class="sub">Mājaslapa šobrīd ir izstrādes stadijā.</p>

      <div class="launch">
        <span class="cal">▣</span>
        <strong>PĀRCEĻAM</strong> darbu sāks <strong>2027. gadā.</strong>
      </div>

      <div class="footer">Drīzumā tiekamies!</div>
    </section>
  </div>
</main>
</body>
</html>
